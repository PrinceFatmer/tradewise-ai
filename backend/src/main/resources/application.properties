# Application
spring.application.name=tradewise-ai-backend
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/tradewise_db
spring.datasource.username=tradewise_user
spring.datasource.password=tradewise_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (custom properties)
jwt.secret=dev-secret-key-at-least-256-bits-long-for-hmac-sha256-algorithm
jwt.expiration=3600000

# App (custom properties)
app.cors.allowed-origins=http://localhost:5173
app.price-simulation.interval-ms=5000
app.initial-balance=1000000.00

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.root=INFO
logging.level.com.tradewise=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE